name: README pull request gate
on:
  pull_request:
permissions:
  contents: read
jobs:
  reviewed-branch:
    if: ${{ github.event.pull_request.number == 62 && github.event.pull_request.head.repo.full_name == github.repository }}
    uses: tigrbl/tigrbl/.github/workflows/readme-standards.yml@docs/readme-standards-20261119
  default-branch:
    if: ${{ github.event.pull_request.number != 62 || github.event.pull_request.head.repo.full_name != github.repository }}
    uses: tigrbl/tigrbl/.github/workflows/readme-standards.yml@master
