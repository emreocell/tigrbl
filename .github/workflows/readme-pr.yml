# Call trusted reusable workflow refs so the restricted runner group can authenticate jobs.
# Fallback definitions are immutable; the checkout still tests the pull request merge revision.
name: Pull request CI
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: pull-request-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  branch-coverage-reviewed:
    if: ${{ github.event.pull_request.number == 62 && github.event.pull_request.head.repo.full_name == github.repository }}
    uses: tigrbl/tigrbl/.github/workflows/branch-coverage.yml@docs/readme-standards-20261119
  branch-coverage-default:
    if: ${{ !(github.event.pull_request.number == 62 && github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: tigrbl/tigrbl/.github/workflows/branch-coverage.yml@3d317e93247403706fb1efcc0fc338c3440ddc05
  cli-smoke-reviewed:
    if: ${{ github.event.pull_request.number == 62 && github.event.pull_request.head.repo.full_name == github.repository }}
    uses: tigrbl/tigrbl/.github/workflows/cli-smoke.yml@docs/readme-standards-20261119
  cli-smoke-default:
    if: ${{ !(github.event.pull_request.number == 62 && github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: tigrbl/tigrbl/.github/workflows/cli-smoke.yml@3d317e93247403706fb1efcc0fc338c3440ddc05
